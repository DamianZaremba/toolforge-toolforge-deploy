---
environments:
  local:
    values:
      # needed to use the chartVersion
      - values/local.yaml
  toolsbeta:
    values:
      # needed to use the chartVersion
      - values/toolsbeta.yaml
  tools:
    values:
      # needed to use the chartVersion
      - values/tools.yaml

---
repositories:
  - name: toolsbeta
    url: toolsbeta-harbor.wmcloud.org/toolforge
    oci: true
  - name: tools
    url: tools-harbor.wmcloud.org/toolforge
    oci: true

releases:
  - name: calico
    chart: "{{ .Values.chartRepository }}/calico"
    version: "{{ .Values.chartVersion }}"
    namespace: kube-system
    createNamespace: true
    values:
      - values/{{ .Environment.Name }}.yaml*

helmDefaults:
  # Bump timeout to an hour since upgrading all of the node pods takes
  # a really really long time
  timeout: 3600
