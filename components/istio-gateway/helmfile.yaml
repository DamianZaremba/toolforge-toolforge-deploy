---
environments:
  local:
    values:
      # needed to use the chartVersion
      - values/local.yaml*
  toolsbeta:
    values:
      # needed to use the chartVersion
      - values/toolsbeta.yaml*
  tools:
    values:
      # needed to use the chartVersion
      - values/tools.yaml*

---
repositories:
  - name: wmf-stable
    url: https://helm-charts.wikimedia.org/stable

releases:
  - name: istio-gateway
    namespace: istio-gateway
    createNamespace: true
    chart: wmf-stable/raw
    version: v0.3.0
    values:
      - values/common.yaml*
